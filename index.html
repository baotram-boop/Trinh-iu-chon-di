<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trịnh iu chọn đi 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF7E8;
    --cream-deep:#FBEFD2;
    --pink-soft:#F7C6D9;
    --pink:#EE7FA6;
    --pink-deep:#D94C7B;
    --sage:#8FAE8B;
    --sage-deep:#5F8360;
    --brown:#5B4636;
    --sky:#CFE3EF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Nunito', sans-serif;
    color:var(--brown);
    background:
      radial-gradient(circle at 15% 8%, #E4EEF6 0%, transparent 45%),
      linear-gradient(180deg, var(--sky) 0%, var(--cream) 35%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }
  .phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    position:relative;
    padding:28px 20px 60px;
  }
  .eyebrow{
    text-align:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:2px;
    color:var(--sage-deep);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  h1.title{
    font-family:'Baloo 2', sans-serif;
    text-align:center;
    color:var(--pink-deep);
    font-size:34px;
    font-weight:800;
    line-height:1.15;
    margin:0 0 24px;
    text-shadow: 2px 2px 0px rgba(238,127,166,0.18);
  }
  .card{
    background:var(--cream-deep);
    border-radius:32px 32px 20px 20px;
    box-shadow: 0 12px 30px -10px rgba(217,76,123,0.25);
    padding:30px 22px 26px;
    position:relative;
  }
  .menu-btn{
    display:block;
    width:100%;
    padding:16px 18px;
    margin-bottom:14px;
    border-radius:999px;
    border:2px solid var(--pink);
    background:#fff;
    color:var(--pink-deep);
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.4px;
    cursor:pointer;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    text-align:center;
  }
  .menu-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 14px -6px rgba(238,127,166,0.5);
    background:var(--pink-soft);
  }
  .menu-btn:active{ transform:translateY(0px) scale(0.98); }
  .menu-btn .sub{
    display:block;
    font-family:'Nunito', sans-serif;
    font-weight:600;
    font-size:11.5px;
    color:var(--sage-deep);
    margin-top:2px;
    letter-spacing:0.2px;
  }

  .screen{ display:none; animation: fadeIn .35s ease; }
  .screen.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .back-btn{
    background:none;
    border:none;
    color:var(--sage-deep);
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    padding:0 0 14px;
    display:flex;
    align-items:center;
    gap:4px;
  }

  /* Lời khuyên hôm nay */
  .advice-box{
    background:#fff;
    border-radius:20px;
    padding:26px 20px;
    text-align:center;
    border:2px dashed var(--pink);
    min-height:140px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .advice-text{
    font-family:'Baloo 2', sans-serif;
    font-size:17px;
    font-weight:600;
    color:var(--brown);
    line-height:1.5;
  }
  .date-tag{
    text-align:center;
    font-size:12px;
    color:var(--sage-deep);
    font-weight:700;
    margin:10px 0 16px;
  }
  .action-btn{
    display:block;
    width:100%;
    padding:14px;
    border-radius:999px;
    border:none;
    background:var(--pink-deep);
    color:#fff;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    margin-top:14px;
  }
  .action-btn:active{ transform:scale(0.98); }
  .action-btn.secondary{
    background:transparent;
    color:var(--pink-deep);
    border:2px solid var(--pink-deep);
  }

  /* History list */
  .history-item{
    background:#fff;
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:10px;
    border-left:5px solid var(--sage);
    font-size:14px;
    font-weight:600;
  }
  .history-item .hdate{
    display:block;
    font-size:11px;
    color:var(--sage-deep);
    font-weight:700;
    margin-bottom:4px;
  }
  .empty-msg{
    text-align:center;
    color:var(--sage-deep);
    font-weight:700;
    font-family:'Baloo 2', sans-serif;
    padding:30px 10px;
  }

  /* Card draw */
  .card-table{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    margin:10px 0 8px;
  }
  .mini-card{
    aspect-ratio:2/3;
    background:linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:#fff;
    font-size:22px;
    box-shadow:0 6px 12px -6px rgba(217,76,123,0.5);
    transition: transform .2s ease;
    user-select:none;
  }
  .mini-card:hover{ transform:translateY(-4px) rotate(-2deg); }
  .mini-card.picked{ opacity:0.25; pointer-events:none; }
  .result-card{
    background:#fff;
    border-radius:20px;
    padding:24px 20px;
    text-align:center;
    border:2px solid var(--pink);
    margin-top:14px;
  }
  .result-card .icon{ font-size:34px; margin-bottom:8px; display:block;}
  .result-card .txt{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:16px;
  }

  /* Wheel */
  .wheel-tabs{
    display:flex;
    gap:6px;
    margin-bottom:14px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .wheel-tab{
    padding:7px 14px;
    border-radius:999px;
    border:2px solid var(--pink);
    background:#fff;
    color:var(--pink-deep);
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:12px;
    cursor:pointer;
  }
  .wheel-tab.active{
    background:var(--pink-deep);
    color:#fff;
    border-color:var(--pink-deep);
  }
  .wheel-wrap{
    display:flex;
    justify-content:center;
    margin:6px 0 18px;
    position:relative;
  }
  .pointer{
    position:absolute;
    top:-6px;
    left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:10px solid transparent;
    border-right:10px solid transparent;
    border-top:18px solid var(--pink-deep);
    z-index:5;
  }
  #wheel{
    width:260px;
    height:260px;
    border-radius:50%;
    transition: transform 4s cubic-bezier(.17,.67,.21,1);
    box-shadow:0 10px 24px -8px rgba(217,76,123,0.4);
    border:6px solid #fff;
  }
  .wheel-result{
    background:#fff;
    border-radius:18px;
    padding:18px;
    text-align:center;
    border:2px solid var(--sage);
    display:none;
  }
  .wheel-result.show{ display:block; }
  .wheel-result .txt{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:16px;
    color:var(--sage-deep);
  }

  /* Quiz (câu hỏi hiểu nhau) */
  .quiz-progress{
    text-align:center;
    font-size:12px;
    font-weight:700;
    color:var(--sage-deep);
    margin-bottom:10px;
  }
  .quiz-q{
    background:#fff;
    border-radius:20px;
    padding:24px 20px;
    text-align:center;
    border:2px dashed var(--sage);
    min-height:110px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:16px;
  }

  /* Love counter */
  .counter-setup{
    background:#fff;
    border-radius:20px;
    padding:22px 20px;
    text-align:center;
    border:2px dashed var(--pink);
  }
  .counter-setup input[type="date"]{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:2px solid var(--pink-soft);
    font-family:'Nunito', sans-serif;
    font-size:14px;
    font-weight:700;
    color:var(--brown);
    margin-top:10px;
    margin-bottom:6px;
  }
  .counter-setup label{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--pink-deep);
  }
  .counter-display{
    text-align:center;
    padding:10px 0 6px;
  }
  .counter-number{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:52px;
    color:var(--pink-deep);
    line-height:1;
  }
  .counter-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--sage-deep);
    margin-top:4px;
  }
  .counter-since{
    text-align:center;
    font-size:12px;
    color:var(--brown);
    opacity:0.7;
    margin-top:4px;
  }
  .milestone-box{
    background:#fff;
    border-radius:16px;
    padding:16px;
    margin-top:18px;
    border-left:5px solid var(--pink);
  }
  .milestone-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--pink-deep);
    margin-bottom:8px;
  }
  .milestone-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    font-weight:600;
    padding:5px 0;
    border-bottom:1px dashed #f0d9e3;
  }
  .milestone-row:last-child{ border-bottom:none; }
  .milestone-row.done{ color:var(--sage-deep); }
  .milestone-row.next{ color:var(--pink-deep); font-weight:800; }

  /* Love language quiz */
  .ll-option{
    display:block;
    width:100%;
    text-align:left;
    padding:13px 16px;
    margin-bottom:10px;
    border-radius:14px;
    border:2px solid var(--pink-soft);
    background:#fff;
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:13.5px;
    color:var(--brown);
    cursor:pointer;
  }
  .ll-option:hover{ background:var(--pink-soft); }
  .ll-result-box{
    background:#fff;
    border-radius:20px;
    padding:26px 20px;
    text-align:center;
    border:2px solid var(--pink);
  }
  .ll-result-icon{ font-size:40px; display:block; margin-bottom:8px; }
  .ll-result-name{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:19px;
    color:var(--pink-deep);
    margin-bottom:8px;
  }
  .ll-result-desc{
    font-size:14px;
    font-weight:600;
    line-height:1.5;
  }
  .ll-bars{ margin-top:18px; }
  .ll-bar-row{ margin-bottom:10px; }
  .ll-bar-label{
    font-size:12px;
    font-weight:700;
    color:var(--sage-deep);
    margin-bottom:3px;
    display:flex;
    justify-content:space-between;
  }
  .ll-bar-track{
    background:#f2e2ea;
    border-radius:999px;
    height:10px;
    overflow:hidden;
  }
  .ll-bar-fill{
    height:100%;
    background:var(--pink-deep);
    border-radius:999px;
    transition: width .6s ease;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="eyebrow">Welcome to em Tram'shop</div>
  <h1 class="title">TRỊNH IU<br>CHỌN ĐI 💗</h1>

  <!-- MAIN MENU -->
  <div id="screen-menu" class="screen active">
    <div class="card">
      <button class="menu-btn" onclick="showScreen('advice')">
        LỜI KHUYÊN HÔM NAY
        <span class="sub">1 câu mỗi ngày nhá</span>
      </button>
      <button class="menu-btn" onclick="showScreen('history')">
        LỜI KHUYÊN ĐÃ NHẬN
        <span class="sub">xem lại những gì đã đọc</span>
      </button>
      <button class="menu-btn" onclick="showScreen('draw')">
        RÚT BÀI MAY MẮN
        <span class="sub">rút 1 thử thách ngẫu nhiên</span>
      </button>
      <button class="menu-btn" onclick="showScreen('wheel')">
        VÒNG QUAY HẸN HÒ
        <span class="sub">tụi mình ăn gì / đi đâu / làm gì cuối tuần</span>
      </button>
      <button class="menu-btn" onclick="showScreen('quiz'); startQuiz();">
        CÂU HỎI HIỂU NHAU
        <span class="sub">1 câu mỗi lần, trả lời cùng nhau</span>
      </button>
      <button class="menu-btn" onclick="showScreen('counter')">
        ĐẾM NGÀY YÊU
        <span class="sub">số ngày tụi mình bên nhau + mốc kỷ niệm</span>
      </button>
      <button class="menu-btn" onclick="showScreen('lovelang'); startLoveLang();">
        LOVE LANGUAGE QUIZ
        <span class="sub">tìm ngôn ngữ tình yêu của anh và em</span>
      </button>
    </div>
  </div>

  <!-- ADVICE OF THE DAY -->
  <div id="screen-advice" class="screen">
    <div class="card">
      <button class="back-btn" onclick="showScreen('menu')">← Quay lại</button>
      <div class="date-tag" id="advice-date"></div>
      <div class="advice-box">
        <div class="advice-text" id="advice-text">Đang tải...</div>
      </div>
      <button class="action-btn" onclick="newAdvice()">RÚT LỜI KHUYÊN KHÁC 🔁</button>
    </div>
  </div>

  <!-- HISTORY -->
  <div id="screen-history" class="screen">
    <div class="card">
      <button class="back-btn" onclick="showScreen('menu')">← Quay lại</button>
      <div id="history-list"></div>
    </div>
  </div>

  <!-- CARD DRAW -->
  <div id="screen-draw" class="screen">
    <div class="card">
      <button class="back-btn" onclick="showScreen('menu')">← Quay lại</button>
      <div class="date-tag">Chọn 1 lá bài bất kỳ</div>
      <div class="card-table" id="card-table"></div>
      <div id="draw-result"></div>
      <button class="action-btn secondary" onclick="resetDraw()">TRÁO BÀI LẠI 🔀</button>
    </div>
  </div>

  <!-- WHEEL -->
  <div id="screen-wheel" class="screen">
    <div class="card">
      <button class="back-btn" onclick="showScreen('menu')">← Quay lại</button>
      <div class="date-tag">Chọn nhóm rồi quay</div>
      <div class="wheel-tabs" id="wheel-tabs"></div>
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <svg id="wheel" viewBox="0 0 200 200"></svg>
      </div>
      <button class="action-btn" onclick="spinWheel()">QUAY LIỀN ĐI 🎡</button>
      <div class="wheel-result" id="wheel-result">
        <div class="txt" id="wheel-result-text"></div>
      </div>
    </div>
  </div>

  <!-- QUIZ (câu hỏi hiểu nhau) -->
  <div id="screen-quiz" class="screen">
    <div class="card">
      <button class="back-btn" onclick="showScreen('menu')">← Quay lại</button>
      <div class="quiz-progress" id="quiz-progress"></div>
      <div class="quiz-q" id="quiz-q"></div>
      <button class="action-btn" onclick="nextQuiz()">CÂU TIẾP THEO ➜</button>
    </div>
  </div>

  <!-- LOVE COUNTER -->
  <div id="screen-counter" class="screen">
    <div class="card">
      <button class="back-btn" onclick="showScreen('menu')">← Quay lại</button>

      <div id="counter-setup-box" class="counter-setup">
        <label>Hai đứa mình bắt đầu yêu từ ngày nào?</label>
        <input type="date" id="counter-date-input">
        <button class="action-btn" onclick="saveLoveDate()">LƯU LẠI 💾</button>
      </div>

      <div id="counter-result-box" style="display:none;">
        <div class="counter-display">
          <div class="counter-number" id="counter-days">0</div>
          <div class="counter-label">ngày bên nhau</div>
          <div class="counter-since" id="counter-since"></div>
        </div>
        <div class="milestone-box">
          <div class="milestone-title">MỐC KỶ NIỆM</div>
          <div id="milestone-list"></div>
        </div>
        <button class="action-btn secondary" onclick="editLoveDate()">SỬA NGÀY BẮT ĐẦU ✏️</button>
      </div>
    </div>
  </div>

  <!-- LOVE LANGUAGE QUIZ -->
  <div id="screen-lovelang" class="screen">
    <div class="card">
      <button class="back-btn" onclick="showScreen('menu')">← Quay lại</button>

      <div id="ll-quiz-box">
        <div class="quiz-progress" id="ll-progress"></div>
        <div class="quiz-q" id="ll-question" style="margin-bottom:16px;"></div>
        <div id="ll-options"></div>
      </div>

      <div id="ll-result-box" style="display:none;">
        <div class="ll-result-box">
          <span class="ll-result-icon" id="ll-result-icon"></span>
          <div class="ll-result-name" id="ll-result-name"></div>
          <div class="ll-result-desc" id="ll-result-desc"></div>
        </div>
        <div class="ll-bars" id="ll-bars"></div>
        <button class="action-btn secondary" onclick="startLoveLang()">LÀM LẠI 🔁</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ---------- DATA (mẫu gợi ý, có thể tự chỉnh sửa) ---------- */
const ADVICE_LIST = [
  "Hôm nay hãy khen người iu một điều thật cụ thể, đừng chỉ nói 'em/anh đẹp quá' chung chung.",
  "Khi cãi nhau, thử dừng lại 5 giây trước khi trả lời — nhiều khi câu đầu tiên không phải câu nên nói.",
  "Gửi cho người iu một tin nhắn 'nhớ mỗi vậy thôi' vào giữa giờ làm việc, không cần lý do.",
  "Hỏi người iu một ngày của họ đã qua như thế nào, và thực sự lắng nghe hết câu trả lời.",
  "Đừng so sánh mối quan hệ của mình với ai khác — mỗi cặp đôi có nhịp riêng.",
  "Thử làm một việc nhỏ mà người iu thích nhưng bạn không thích lắm, chỉ vì họ vui.",
  "Nói lời xin lỗi trước không phải là thua, mà là ai đó phải là người trưởng thành trước.",
  "Dành 10 phút không điện thoại, chỉ ngồi nói chuyện với nhau hôm nay.",
  "Nhắc lại một kỷ niệm vui giữa hai người, để nhắc nhau nhớ vì sao mình chọn nhau.",
  "Đừng im lặng khi buồn quá lâu — nói ra, dù chỉ một câu ngắn, còn hơn để bụng.",
  "Hỏi người iu: 'Dạo này em/anh cần gì ở anh/em nhiều hơn không?'",
  "Chăm sóc bản thân tốt cũng là một cách yêu người iu — đừng quên điều đó.",
  "Thử nấu chung một món mới cuối tuần này, dù có thể sẽ hơi lộn xộn.",
  "Nếu có điều gì đang khó chịu trong lòng, nói ra sớm, đừng để nó tích tụ thành giận không rõ lý do.",
  "Gửi một tấm ảnh cũ kèm câu 'lúc đó vui thật' — nhắc nhau về hành trình đã đi.",
  "Học cách chấp nhận người iu không hoàn hảo, giống như họ cũng đang chấp nhận điều đó ở bạn.",
  "Đặt điện thoại xuống trong bữa ăn hôm nay, để trọn vẹn cho nhau.",
  "Nói 'cảm ơn' với những điều nhỏ người iu làm mà bạn hay coi là hiển nhiên.",
  "Thử hỏi han về gia đình, bạn bè của người iu — quan tâm vòng tròn của họ cũng là quan tâm họ.",
  "Đừng ngại thể hiện tình cảm trước mặt người khác một chút, nếu cả hai đều thoải mái."
];

const DRAW_CARDS = [

/* ---------- STATE (lưu bằng localStorage) ---------- */
function getHistory(){
  try{ return JSON.parse(localStorage.getItem('trinhiu_history') || '[]'); }
  catch(e){ return []; }
}
function saveHistory(list){
  localStorage.setItem('trinhiu_history', JSON.stringify(list));
}
function addHistory(text){
  const list = getHistory();
  const now = new Date();
  const dateStr = now.toLocaleDateString('vi-VN') + ' ' + now.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
  list.unshift({ date: dateStr, text: text });
  saveHistory(list.slice(0,50));
}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  if(name==='advice') loadTodayAdvice();
  if(name==='history') renderHistory();
  if(name==='draw') resetDraw();
  if(name==='wheel') initWheelScreen();
  if(name==='counter') initCounterScreen();
}

/* ---------- ADVICE ---------- */
function dayIndexSeed(){
  const d = new Date();
  const start = new Date(d.getFullYear(),0,0);
  const diff = d - start;
  return Math.floor(diff / 86400000);
}
function loadTodayAdvice(customIndex){
  const idx = (typeof customIndex === 'number') ? customIndex : (dayIndexSeed() % ADVICE_LIST.length);
  const text = ADVICE_LIST[idx];
  document.getElementById('advice-text').textContent = text;
  document.getElementById('advice-date').textContent = new Date().toLocaleDateString('vi-VN', {weekday:'long', day:'2-digit', month:'2-digit'});
  addHistory(text);
}
function newAdvice(){
  const idx = Math.floor(Math.random()*ADVICE_LIST.length);
  loadTodayAdvice(idx);
}

/* ---------- HISTORY ---------- */
function renderHistory(){
  const list = getHistory();
  const container = document.getElementById('history-list');
  if(list.length===0){

  container.innerHTML = list.map(item => `

/* ---------- WHEEL (có nhóm) ---------- */
let currentRotation = 0;
function initWheelScreen(){
  const tabsWrap = document.getElementById('wheel-tabs');
  tabsWrap.innerHTML = Object.keys(WHEEL_GROUPS).map(g =>
    `<button class="wheel-tab ${g===currentWheelGroup?'active':''}" onclick="switchWheelGroup('${g}')">${g}</button>`
  ).join('');
  document.getElementById('wheel-result').classList.remove('show');
  buildWheel();
}
function switchWheelGroup(g){
  currentWheelGroup = g;
  currentRotation = 0;
  document.getElementById('wheel').style.transition = 'none';
  document.getElementById('wheel').style.transform = 'rotate(0deg)';
  requestAnimationFrame(()=>{ document.getElementById('wheel').style.transition = 'transform 4s cubic-bezier(.17,.67,.21,1)'; });
  initWheelScreen();
}
function buildWheel(){
  const svg = document.getElementById('wheel');
  const options = WHEEL_GROUPS[currentWheelGroup];
  const n = options.length;
  const cx=100, cy=100, r=100;
  let paths = '';
  for(let i=0;i<n;i++){
    const startAngle = (i/n)*2*Math.PI - Math.PI/2;
    const endAngle = ((i+1)/n)*2*Math.PI - Math.PI/2;
    const x1 = cx + r*Math.cos(startAngle);
    const y1 = cy + r*Math.sin(startAngle);
    const x2 = cx + r*Math.cos(endAngle);
    const y2 = cy + r*Math.sin(endAngle);
    paths += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 0,1 ${x2},${y2} Z" fill="${WHEEL_COLORS[i % WHEEL_COLORS.length]}" stroke="#fff" stroke-width="1.5"/>`;
    const midAngle = (startAngle+endAngle)/2;
    const tx = cx + (r*0.62)*Math.cos(midAngle);
    const ty = cy + (r*0.62)*Math.sin(midAngle);
    const rotDeg = (midAngle*180/Math.PI)+90;
    paths += `<text x="${tx}" y="${ty}" font-size="6.5" font-family="Baloo 2, sans-serif" font-weight="700" fill="#5B4636" text-anchor="middle" transform="rotate(${rotDeg} ${tx} ${ty})">${wrapText(options[i])}</text>`;
  }
  svg.innerHTML = paths;
}
function wrapText(t){
  return t.length > 16 ? t.slice(0,15)+'…' : t;
}
function spinWheel(){
  const options = WHEEL_GROUPS[currentWheelGroup];
  const n = options.length;
  const chosen = Math.floor(Math.random()*n);
  const degPerSlice = 360/n;
  const targetCenter = chosen*degPerSlice + degPerSlice/2;
  const spins = 5*360;
  const finalRotation = spins + (360 - targetCenter);
  currentRotation += finalRotation;
  const svg = document.getElementById('wheel');
  svg.style.transform = `rotate(${currentRotation}deg)`;
  document.getElementById('wheel-result').classList.remove('show');
  setTimeout(()=>{
    document.getElementById('wheel-result-text').textContent = "💚 " + options[chosen];
    document.getElementById('wheel-result').classList.add('show');
    addHistory(`[${currentWheelGroup}] ` + options[chosen]);
  }, 4100);
}

/* ---------- LOVE COUNTER ---------- */
const MILESTONES = [
  { days: 30, label: "Tròn 1 tháng" },
  { days: 100, label: "Tròn 100 ngày" },
  { days: 200, label: "Tròn 200 ngày" },
  { days: 365, label: "Tròn 1 năm" },
  { days: 500, label: "Tròn 500 ngày" },
  { days: 730, label: "Tròn 2 năm" },
  { days: 1000, label: "Tròn 1000 ngày" },
  { days: 1095, label: "Tròn 3 năm" }
];
function getLoveDate(){
  return localStorage.getItem('trinhiu_lovedate');
}
function saveLoveDate(){
  const input = document.getElementById('counter-date-input').value;
  if(!input){ return; }
  localStorage.setItem('trinhiu_lovedate', input);
  renderCounter();
}
function editLoveDate(){
  document.getElementById('counter-setup-box').style.display = 'block';
  document.getElementById('counter-result-box').style.display = 'none';
  const existing = getLoveDate();
  if(existing) document.getElementById('counter-date-input').value = existing;
}
function initCounterScreen(){
  const existing = getLoveDate();
  if(existing){
    renderCounter();
  } else {
    document.getElementById('counter-setup-box').style.display = 'block';
    document.getElementById('counter-result-box').style.display = 'none';
  }
}
function renderCounter(){
  const dateStr = getLoveDate();
  if(!dateStr) return;
  const start = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  const diffDays = Math.floor((now - start) / 86400000);

  document.getElementById('counter-setup-box').style.display = 'none';
  document.getElementById('counter-result-box').style.display = 'block';
  document.getElementById('counter-days').textContent = diffDays >= 0 ? diffDays : 0;
  document.getElementById('counter-since').textContent = "kể từ ngày " + start.toLocaleDateString('vi-VN');

  const list = document.getElementById('milestone-list');
  let nextShown = false;
  list.innerHTML = MILESTONES.map(m => {
    const done = diffDays >= m.days;
    const isNext = !done && !nextShown;
    if(isNext) nextShown = true;
    const cls = done ? 'done' : (isNext ? 'next' : '');
    const rightText = done ? '✔ đã qua' : (isNext ? `còn ${m.days - diffDays} ngày` : `ngày thứ ${m.days}`);
    return `<div class="milestone-row ${cls}"><span>${m.label}</span><span>${rightText}</span></div>`;
  }).join('');
}

let llIndex = 0;
let llScores = {};
function startLoveLang(){
  llIndex = 0;
  llScores = { words:0, acts:0, gifts:0, time:0, touch:0 };
  document.getElementById('ll-quiz-box').style.display = 'block';
  document.getElementById('ll-result-box').style.display = 'none';

}
function renderLLQuestion(){
  const q = LL_QUESTIONS[llIndex];
  document.getElementById('ll-progress').textContent = `Câu ${llIndex+1} / ${LL_QUESTIONS.length}`;
  document.getElementById('ll-question').textContent = q.q;
  document.getElementById('ll-options').innerHTML = q.opts.map((o,i) =>
    `<button class="ll-option" onclick="answerLL('${o.lang}')">${o.t}</button>`
  ).join('');
}
function answerLL(lang){
  llScores[lang] = (llScores[lang]||0) + 1;
  llIndex++;
  if(llIndex < LL_QUESTIONS.length){
    renderLLQuestion();
  } else {
    showLLResult();
  }
}
function showLLResult(){
  document.getElementById('ll-quiz-box').style.display = 'none';
  document.getElementById('ll-result-box').style.display = 'block';

  let topLang = 'words', topScore = -1;
  for(const k in llScores){
    if(llScores[k] > topScore){ topScore = llScores[k]; topLang = k; }
  }
  const info = LL_INFO[topLang];
  document.getElementById('ll-result-icon').textContent = info.icon;
  document.getElementById('ll-result-name').textContent = info.name;
  document.getElementById('ll-result-desc').textContent = info.desc;

  const total = LL_QUESTIONS.length;
  const order = ['words','acts','gifts','time','touch'];
  document.getElementById('ll-bars').innerHTML = order.map(k => {
    const pct = Math.round((llScores[k]/total)*100);
    return `
      <div class="ll-bar-row">
        <div class="ll-bar-label"><span>${LL_INFO[k].icon} ${LL_INFO[k].name.split('(')[0].trim()}</span><span>${pct}%</span></div>
        <div class="ll-bar-track"><div class="ll-bar-fill" style="width:${pct}%"></div></div>
      </div>
    `;
  }).join('');

  addHistory(`[Love Language] Kết quả: ${info.name}`);
}
