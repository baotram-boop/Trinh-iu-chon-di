<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trịnh iu chọn đi 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF7E8;
    --cream-deep:#FBEFD2;
    --pink-soft:#F7C6D9;
    --pink:#EE7FA6;
    --pink-deep:#D94C7B;
    --sage:#8FAE8B;
    --sage-deep:#5F8360;
    --brown:#5B4636;
    --sky:#CFE3EF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Nunito', sans-serif;
    color:var(--brown);
    background:
      radial-gradient(circle at 15% 8%, #E4EEF6 0%, transparent 45%),
      linear-gradient(180deg, var(--sky) 0%, var(--cream) 35%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }
  .phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    position:relative;
    padding:28px 20px 60px;
  }

  .eyebrow{
    text-align:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:2px;
    color:var(--sage-deep);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  h1.title{
    font-family:'Baloo 2', sans-serif;
    text-align:center;
    color:var(--pink-deep);
    font-size:34px;
    font-weight:800;
    line-height:1.15;
    margin:0 0 24px;
    text-shadow: 2px 2px 0px rgba(238,127,166,0.18);
  }
  .card{
    background:var(--cream-deep);
    border-radius:32px 32px 20px 20px;
    box-shadow: 0 12px 30px -10px rgba(217,76,123,0.25);
    padding:30px 22px 26px;
    position:relative;
  }
  .menu-btn{
    display:block;
    width:100%;
    padding:16px 18px;
    margin-bottom:14px;
    border-radius:999px;
    border:2px solid var(--pink);
    background:#fff;
    color:var(--pink-deep);
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.4px;
    cursor:pointer;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    text-align:center;
  }
  .menu-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 14px -6px rgba(238,127,166,0.5);
    background:var(--pink-soft);
  }
  .menu-btn:active{ transform:translateY(0px) scale(0.98); }
  .menu-btn .sub{
    display:block;
    font-family:'Nunito', sans-serif;
    font-weight:600;
    font-size:11.5px;
    color:var(--sage-deep);
    margin-top:2px;
    letter-spacing:0.2px;
  }

  .screen{ display:none; animation: fadeIn .35s ease; }
  .screen.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .back-btn{
    background:none;
    border:none;
    color:var(--sage-deep);
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    padding:0 0 14px;
    display:flex;
    align-items:center;
    gap:4px;
  }

  /* Lời khuyên hôm nay */
  .advice-box{
    background:#fff;
    border-radius:20px;
    padding:26px 20px;
    text-align:center;
    border:2px dashed var(--pink);
    min-height:140px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .advice-text{
    font-family:'Baloo 2', sans-serif;
    font-size:17px;
    font-weight:600;
    color:var(--brown);
    line-height:1.5;
  }
  .date-tag{
    text-align:center;
    font-size:12px;
    color:var(--sage-deep);
    font-weight:700;
    margin:10px 0 16px;
  }
  .action-btn{
    display:block;
    width:100%;
    padding:14px;
    border-radius:999px;
    border:none;
    background:var(--pink-deep);
    color:#fff;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    margin-top:14px;
  }
  .action-btn:active{ transform:scale(0.98); }
  .action-btn.secondary{
    background:transparent;
    color:var(--pink-deep);
    border:2px solid var(--pink-deep);
  }

  .empty-msg{
    text-align:center;
    color:var(--sage-deep);
    font-weight:700;
    font-family:'Baloo 2', sans-serif;
    padding:30px 10px;
  }

  /* Card draw */
  .card-table{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    margin:10px 0 8px;
  }
  .mini-card{
    aspect-ratio:2/3;
    background:linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:#fff;
    font-size:22px;
    box-shadow:0 6px 12px -6px rgba(217,76,123,0.5);
    transition: transform .2s ease;
    user-select:none;
  }
  .mini-card:hover{ transform:translateY(-4px) rotate(-2deg); }
  .mini-card.picked{ opacity:0.25; pointer-events:none; }
  .result-card{
    background:#fff;
    border-radius:20px;
    padding:24px 20px;
    text-align:center;
    border:2px solid var(--pink);
    margin-top:14px;
  }
  .result-card .icon{ font-size:34px; margin-bottom:8px; display:block;}
  .result-card .txt{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:16px;
  }

  /* Wheel */
  .wheel-tabs{
    display:flex;
    gap:6px;
    margin-bottom:14px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .wheel-tab{
    padding:7px 14px;
    border-radius:999px;
    border:2px solid var(--pink);
    background:#fff;
    color:var(--pink-deep);
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:12px;
    cursor:pointer;
  }
  .wheel-tab.active{
    background:var(--pink-deep);
    color:#fff;
    border-color:var(--pink-deep);
  }
  .wheel-wrap{
    display:flex;
    justify-content:center;
    margin:6px 0 18px;
    position:relative;
  }
  .pointer{
    position:absolute;
    top:-6px;
    left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:10px solid transparent;
    border-right:10px solid transparent;
    border-top:18px solid var(--pink-deep);
    z-index:5;
  }
  #wheel{
    width:260px;
    height:260px;
    border-radius:50%;
    transition: transform 4s cubic-bezier(.17,.67,.21,1);
    box-shadow:0 10px 24px -8px rgba(217,76,123,0.4);
    border:6px solid #fff;
  }
  .wheel-result{
    background:#fff;
    border-radius:18px;
    padding:18px;
    text-align:center;
    border:2px solid var(--sage);
    display:none;
  }
  .wheel-result.show{ display:block; }
  .wheel-result .txt{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:16px;
    color:var(--sage-deep);
  }

  /* Love counter */
  .counter-setup{
    background:#fff;
    border-radius:20px;
    padding:22px 20px;
    text-align:center;
    border:2px dashed var(--pink);
  }
  .counter-setup input[type="date"]{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:2px solid var(--pink-soft);
    font-family:'Nunito', sans-serif;
    font-size:14px;
    font-weight:700;
    color:var(--brown);
    margin-top:10px;
    margin-bottom:6px;
  }
  .counter-setup label{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--pink-deep);
  }
  .counter-display{
    text-align:center;
    padding:10px 0 6px;
  }
  .counter-number{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:52px;
    color:var(--pink-deep);
    line-height:1;
  }
  .counter-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--sage-deep);
    margin-top:4px;
  }
  .counter-since{
    text-align:center;
    font-size:12px;
    color:var(--brown);
    opacity:0.7;
    margin-top:4px;
  }
  .milestone-box{
    background:#fff;
    border-radius:16px;
    padding:16px;
    margin-top:18px;
    border-left:5px solid var(--pink);
  }
  .milestone-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--pink-deep);
    margin-bottom:8px;
  }
  .milestone-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    font-weight:600;
    padding:5px 0;
    border-bottom:1px dashed #f0d9e3;
  }
  .milestone-row:last-child{ border-bottom:none; }
  .milestone-row.done{ color:var(--sage-deep); }
  .milestone-row.next{ color:var(--pink-deep); font-weight:800; }

  /* Love language quiz */
  .ll-option{
    display:block;
    width:100%;
    text-align:left;
    padding:13px 16px;
    margin-bottom:10px;
    border-radius:14px;
    border:2px solid var(--pink-soft);
    background:#fff;
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:13.5px;
    color:var(--brown);
    cursor:pointer;
  }
  .ll-option:hover{ background:var(--pink-soft); }
  .ll-result-box{
    background:#fff;
    border-radius:20px;
    padding:26px 20px;
    text-align:center;
    border:2px solid var(--pink);
  }
  .ll-result-icon{ font-size:40px; display:block; margin-bottom:8px; }
  .ll-result-name{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:19px;
    color:var(--pink-deep);
    margin-bottom:8px;
  }
  .ll-result-desc{
    font-size:14px;
    font-weight:600;
    line-height:1.5;
  }
  .ll-bars{ margin-top:18px; }
  .ll-bar-row{ margin-bottom:10px; }
  .ll-bar-label{
    font-size:12px;
    font-weight:700;
    color:var(--sage-deep);
    margin-bottom:3px;
    display:flex;
    justify-content:space-between;
  }
  .ll-bar-track{
    background:#f2e2ea;
    border-radius:999px;
    height:10px;
    overflow:hidden;
  }
  .ll-bar-fill{
    height:100%;
    background:var(--pink-deep);
    border-radius:999px;
    transition: width .6s ease;
  }

  /* Shared form elements for new features */
  .write-box{
    background:#fff;
    border-radius:18px;
    padding:18px;
    border:2px dashed var(--pink);
    margin-bottom:16px;
  }
  .form-group{ margin-bottom:12px; text-align:left; }
  .form-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--pink-deep);
    display:block;
    margin-bottom:6px;
  }
  .form-input, .form-textarea, .form-select{
    width:100%;
    padding:11px 12px;
    border-radius:12px;
    border:2px solid var(--pink-soft);
    font-family:'Nunito', sans-serif;
    font-size:13.5px;
    font-weight:600;
    color:var(--brown);
    background:#fff;
  }
  .form-textarea{ min-height:70px; resize:vertical; }

  /* Sync code overlay */
  .sync-overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:999;
  }
  .sync-modal{
    background:#fff;
    border-radius:24px;
    padding:28px 24px;
    max-width:320px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.3);
  }
  .sync-modal h2{
    font-family:'Baloo 2', sans-serif;
    font-size:20px;
    font-weight:800;
    color:var(--pink-deep);
    margin:0 0 12px;
  }
  .sync-modal p{
    font-size:13px;
    color:var(--sage-deep);
    margin:0 0 18px;
    line-height:1.5;
  }
  .sync-modal input{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:2px solid var(--pink);
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:18px;
    text-align:center;
    letter-spacing:2px;
    margin-bottom:16px;
    color:var(--pink-deep);
  }
  .sync-modal button{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:none;
    background:var(--pink-deep);
    color:#fff;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    margin-bottom:8px;
  }
  .sync-modal button:active{ transform:scale(0.98); }

  /* Cây biết ơn */
  .tree-wrap{ display:flex; justify-content:center; margin:6px 0 16px; }
  .tree-count{
    text-align:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    color:var(--sage-deep);
    margin-bottom:6px;
    font-size:14px;
  }
  .leaf-item{
    background:#fff;
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:8px;
    border-left:5px solid var(--sage);
    font-size:13.5px;
    font-weight:600;
  }
  .leaf-item .ldate{
    display:block;
    font-size:11px;
    color:var(--sage-deep);
    font-weight:700;
    margin-bottom:3px;
  }

  /* Lời hứa nhỏ */
  .promise-item{
    background:#fff;
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:10px;
    border-left:5px solid var(--pink);
    display:flex;
    align-items:flex-start;
    gap:10px;
  }
  .promise-item input[type="checkbox"]{
    margin-top:3px;
    width:18px;
    height:18px;
    accent-color: var(--pink-deep);
    flex-shrink:0;
  }
  .promise-item .ptext{ font-size:14px; font-weight:600; }
  .promise-item.kept .ptext{ text-decoration:line-through; opacity:0.55; }
  .promise-item .pmeta{
    display:block;
    font-size:11px;
    color:var(--sage-deep);
    font-weight:700;
    margin-bottom:3px;
  }

</style>
</head>
<body>
<div class="phone">
  <!-- SYNC CODE MODAL -->
  <div id="sync-overlay" class="sync-overlay" style="display:none;">
    <div class="sync-modal">
      <h2>🔗 Sync Code</h2>
      <p>Nhập code giống nhau để 2 người xem được dữ liệu của nhau</p>
      <input type="text" id="sync-code-input" placeholder="VD: ABC123" maxlength="20">
      <button onclick="confirmSyncCode()">ĐẶT CODE</button>
    </div>
  </div>

  <div class="eyebrow">Welcome To Em Trâm's Shop</div>
  <h1 class="title">TRỊNH IU<br>CHỌN ĐI 💗</h1>

  <!-- MAIN MENU -->
  <div id="screen-menu" class="screen active">
    <div class="card">
      <button class="menu-btn" onclick="showScreen('advice')">
        LỜI KHUYÊN HÔM NAY
        <span class="sub">1 câu mỗi ngày nhá</span>
      </button>
      <button class="menu-btn" onclick="showScreen('draw')">
        RÚT BÀI MAY MẮN
        <span class="sub">rút 1 thử thách ngẫu nhiên</span>
      </button>
      <button class="menu-btn" onclick="showScreen('wheel')">
        VÒNG QUAY HẸN HÒ
        <span class="sub">tụi mình ăn gì / đi đâu / làm gì cuối tuần</span>
      </button>
      <button class="menu-btn" onclick="showScreen('counter')">
        ĐẾM NGÀY YÊU
        <span class="sub">số ngày tụi mình bên nhau + mốc kỷ niệm</span>
      </button>
      <button class="menu-btn" onclick="showScreen('lovelang'); startLoveLang();">
        LOVE LANGUAGE QUIZ
        <span class="sub">tìm ngôn ngữ tình yêu của anh và em</span>
      </button>
      <button class="menu-btn" onclick="showScreen('tree')">
        CÂY BIẾT ƠN
        <span class="sub">mỗi ngày thêm 1 lá biết ơn</span>
      </button>
      <button class="menu-btn" onclick="showScreen('promise')">
        LỜI HỨA NHỎ
        <span class="sub">những cam kết nho nhỏ để nhắc nhau</span>
      </button>
    </div>
  </div>

  <!-- ADVICE OF THE DAY -->
  <div id="screen-advice" class="screen">
    <div class="card">
      <button class="back-btn" onclick="showScreen('menu')">← Quay lại</button>
      <div class="date-tag" id="advice-date"></div>
      <div class="advice-box">
        <div class="advice-text" id="advice-text">Đang tải...</div>
      </div>
      <button class="action-btn" onclick="newAdvice()">RÚT LỜI KHUYÊN KHÁC 🔁</button>
    </div>
  </div>

  <!-- CARD DRAW -->
  <div id="screen-draw" class="screen">
    <div class="card">
      <button class="back-btn" onclick="showScreen('menu')">← Quay lại</button>
      <div class="date-tag">Chọn 1 lá bài bất kỳ</div>
      <div class="card-table" id="card-table"></div>
      <div id="draw-result"></div>
      <button class="action-btn secondary" onclick="resetDraw()">TRÁO BÀI LẠI 🔀</button>
    </div>
  </div>

  <!-- WHEEL -->
  <div id="screen-wheel" class="screen">
    <div class="card">
      <button class="back-btn" onclick="showScreen('menu')">← Quay lại</button>
      <div class="date-tag">Chọn nhóm rồi quay</div>
      <div class="wheel-tabs" id="wheel-tabs"></div>
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <svg id="wheel" viewBox="0 0 200 200"></svg>
      </div>
      <button class="action-btn" onclick="spinWheel()">QUAY LIỀN ĐI 🎡</button>
      <div class="wheel-result" id="wheel-result">
        <div class="txt" id="wheel-result-text"></div>
      </div>
    </div>
  </div>

  <!-- LOVE COUNTER -->
  <div id="screen-counter" class="screen">
    <div class="card">
      <button class="back-btn" onclick="showScreen('menu')">← Quay lại</button>

      <div id="counter-setup-box" class="counter-setup">
        <label>Hai đứa mình bắt đầu yêu từ ngày nào?</label>
        <input type="date" id="counter-date-input">
        <button class="action-btn" onclick="saveLoveDate()">LƯU LẠI 💾</button>
      </div>

      <div id="counter-result-box" style="display:none;">
        <div class="counter-display">
          <div class="counter-number" id="counter-days">0</div>
          <div class="counter-label">ngày bên nhau</div>
          <div class="counter-since" id="counter-since"></div>
        </div>
        <div class="milestone-box">
          <div class="milestone-title">MỐC KỶ NIỆM</div>
          <div id="milestone-list"></div>
        </div>
        <button class="action-btn secondary" onclick="editLoveDate()">SỬA NGÀY BẮT ĐẦU ✏️</button>
      </div>
    </div>
  </div>

  <!-- LOVE LANGUAGE QUIZ -->
  <div id="screen-lovelang" class="screen">
    <div class="card">
      <button class="back-btn" onclick="showScreen('menu')">← Quay lại</button>

      <div id="ll-quiz-box">
        <div class="quiz-progress" id="ll-progress"></div>
        <div class="quiz-q" id="ll-question" style="margin-bottom:16px;"></div>
        <div id="ll-options"></div>
      </div>

      <div id="ll-result-box" style="display:none;">
        <div class="ll-result-box">
          <span class="ll-result-icon" id="ll-result-icon"></span>
          <div class="ll-result-name" id="ll-result-name"></div>
          <div class="ll-result-desc" id="ll-result-desc"></div>
        </div>
        <div class="ll-bars" id="ll-bars"></div>
        <button class="action-btn secondary" onclick="startLoveLang()">LÀM LẠI 🔁</button>
      </div>
    </div>
  </div>

  <!-- CÂY BIẾT ƠN -->
  <div id="screen-tree" class="screen">
    <div class="card">
      <button class="back-btn" onclick="showScreen('menu')">← Quay lại</button>
      <button class="action-btn secondary" style="font-size:12px; padding:8px; margin-bottom:12px;" onclick="changeSyncCode()">🔗 Đổi Sync Code</button>
      <div class="write-box">
        <div class="form-group">
          <label class="form-label">Hôm nay biết ơn điều gì ở người iu?</label>
          <textarea class="form-textarea" id="leaf-input" placeholder="Ví dụ: cảm ơn vì đã..."></textarea>
        </div>
        <button class="action-btn" onclick="addLeaf()">THÊM LÁ MỚI 🍃</button>
      </div>
      <div class="tree-count" id="tree-count"></div>
      <div class="tree-wrap">
        <svg id="tree-svg" viewBox="0 0 300 300" width="260" height="260"></svg>
      </div>
      <div id="leaf-list"></div>
    </div>
  </div>

  <!-- LỜI HỨA NHỎ -->
  <div id="screen-promise" class="screen">
    <div class="card">

/* ---------- WHEEL (có nhóm) ---------- */
let currentRotation = 0;
function initWheelScreen(){
  const tabsWrap = document.getElementById('wheel-tabs');
  tabsWrap.innerHTML = Object.keys(WHEEL_GROUPS).map(g =>
    `<button class="wheel-tab ${g===currentWheelGroup?'active':''}" onclick="switchWheelGroup('${g}')">${g}</button>`
  ).join('');
  document.getElementById('wheel-result').classList.remove('show');
  buildWheel();
}
function switchWheelGroup(g){
  currentWheelGroup = g;
  currentRotation = 0;
  document.getElementById('wheel').style.transition = 'none';
  document.getElementById('wheel').style.transform = 'rotate(0deg)';
  requestAnimationFrame(()=>{ document.getElementById('wheel').style.transition = 'transform 4s cubic-bezier(.17,.67,.21,1)'; });
  initWheelScreen();
}
function buildWheel(){
  const svg = document.getElementById('wheel');
  const options = WHEEL_GROUPS[currentWheelGroup];
  const n = options.length;
  const cx=100, cy=100, r=100;
  let paths = '';
  for(let i=0;i<n;i++){
    const startAngle = (i/n)*2*Math.PI - Math.PI/2;
    const endAngle = ((i+1)/n)*2*Math.PI - Math.PI/2;
    const x1 = cx + r*Math.cos(startAngle);
    const y1 = cy + r*Math.sin(startAngle);
    const x2 = cx + r*Math.cos(endAngle);
    const y2 = cy + r*Math.sin(endAngle);
    paths += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 0,1 ${x2},${y2} Z" fill="${WHEEL_COLORS[i % WHEEL_COLORS.length]}" stroke="#fff" stroke-width="1.5"/>`;
    const midAngle = (startAngle+endAngle)/2;
    const tx = cx + (r*0.62)*Math.cos(midAngle);
    const ty = cy + (r*0.62)*Math.sin(midAngle);
    const rotDeg = (midAngle*180/Math.PI)+90;
    paths += `<text x="${tx}" y="${ty}" font-size="6.5" font-family="Baloo 2, sans-serif" font-weight="700" fill="#5B4636" text-anchor="middle" transform="rotate(${rotDeg} ${tx} ${ty})">${wrapText(options[i])}</text>`;
  }
  svg.innerHTML = paths;
}
function wrapText(t){
  return t.length > 16 ? t.slice(0,15)+'…' : t;
}
function spinWheel(){
  const options = WHEEL_GROUPS[currentWheelGroup];
  const n = options.length;
  const chosen = Math.floor(Math.random()*n);
  const degPerSlice = 360/n;
  const targetCenter = chosen*degPerSlice + degPerSlice/2;
  const spins = 5*360;
  const finalRotation = spins + (360 - targetCenter);
  currentRotation += finalRotation;
  const svg = document.getElementById('wheel');
  svg.style.transform = `rotate(${currentRotation}deg)`;
  document.getElementById('wheel-result').classList.remove('show');
  setTimeout(()=>{
    document.getElementById('wheel-result-text').textContent = "💚 " + options[chosen];
    document.getElementById('wheel-result').classList.add('show');
  }, 4100);
}

  { days: 30, label: "Tròn 1 tháng" },
  { days: 100, label: "Tròn 100 ngày" },
  { days: 200, label: "Tròn 200 ngày" },
  { days: 365, label: "Tròn 1 năm" },

function getLoveDate(){
  return localStorage.getItem('trinhiu_lovedate');

function saveLoveDate(){
  const input = document.getElementById('counter-date-input').value;
  if(!input){ return; }
  localStorage.setItem('trinhiu_lovedate', input);
  renderCounter();
}
function editLoveDate(){
  document.getElementById('counter-setup-box').style.display = 'block';
  document.getElementById('counter-result-box').style.display = 'none';
  const existing = getLoveDate();
  if(existing) document.getElementById('counter-date-input').value = existing;
}
function initCounterScreen(){
  const existing = getLoveDate();
  if(existing){
    renderCounter();
  } else {
    document.getElementById('counter-setup-box').style.display = 'block';
    document.getElementById('counter-result-box').style.display = 'none';
  }
}
function renderCounter(){
  const dateStr = getLoveDate();
  if(!dateStr) return;
  const start = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  const diffDays = Math.floor((now - start) / 86400000);

  document.getElementById('counter-setup-box').style.display = 'none';
  document.getElementById('counter-result-box').style.display = 'block';
  document.getElementById('counter-days').textContent = diffDays >= 0 ? diffDays : 0;
  document.getElementById('counter-since').textContent = "kể từ ngày " + start.toLocaleDateString('vi-VN');

  const list = document.getElementById('milestone-list');
  let nextShown = false;
  list.innerHTML = MILESTONES.map(m => {
    const done = diffDays >= m.days;
    const isNext = !done && !nextShown;
    if(isNext) nextShown = true;
    const cls = done ? 'done' : (isNext ? 'next' : '');
    const rightText = done ? '✔ đã qua' : (isNext ? `còn ${m.days - diffDays} ngày` : `ngày thứ ${m.days}`);
    return `<div class="milestone-row ${cls}"><span>${m.label}</span><span>${rightText}</span></div>`;
  }).join('');
}

    const pct = Math.round((llScores[k]/total)*100);
    return `
      <div class="ll-bar-row">
        <div class="ll-bar-label"><span>${LL_INFO[k].icon} ${LL_INFO[k].name.split('(')[0].trim()}</span><span>${pct}%</span></div>
        <div class="ll-bar-track"><div class="ll-bar-fill" style="width:${pct}%"></div></div>
      </div>
    `;
  }).join('');
}

/* ---------- SYNC CODE ---------- */
function getSyncCode(){
  return localStorage.getItem('trinhiu_sync_code') || '';
}
function setSyncCode(code){
  localStorage.setItem('trinhiu_sync_code', code);
}
function confirmSyncCode(){
  const code = document.getElementById('sync-code-input').value.trim().toUpperCase();
  if(!code){ alert('Vui lòng nhập code'); return; }
  setSyncCode(code);
  document.getElementById('sync-overlay').style.display = 'none';
  showScreen('menu');
}
function showSyncCodeModal(){
  const existing = getSyncCode();
  if(existing) return; // Nếu đã có code, không hiện modal
  document.getElementById('sync-overlay').style.display = 'flex';
  document.getElementById('sync-code-input').focus();
}
function changeSyncCode(){
  const newCode = prompt('Nhập Sync Code mới:', getSyncCode());
  if(newCode){
    setSyncCode(newCode.trim().toUpperCase());
    renderTree();
    renderPromises();
  }
}

/* ---------- CÂY BIẾT ƠN ---------- */
function getLeaves(){
  const code = getSyncCode();
  const key = code ? `trinhiu_leaves_${code}` : 'trinhiu_leaves';
  try{ return JSON.parse(localStorage.getItem(key) || '[]'); }
  catch(e){ return []; }
}
function saveLeaves(list){
  const code = getSyncCode();
  const key = code ? `trinhiu_leaves_${code}` : 'trinhiu_leaves';
  localStorage.setItem(key, JSON.stringify(list));
}
function addLeaf(){
  const ta = document.getElementById('leaf-input');
  const text = ta.value.trim();
  if(!text) return;
  const list = getLeaves();
  list.push({ date: new Date().toISOString().slice(0,10), text: text });
  saveLeaves(list);
  ta.value = '';
  renderTree();
}
function renderTree(){
  const list = getLeaves();
  document.getElementById('tree-count').textContent = `🍃 ${list.length} lá biết ơn đã được thêm`;
  buildTreeSVG(list.length);
  const container = document.getElementById('leaf-list');
  if(list.length===0){
    container.innerHTML = '<div class="empty-msg">Cây còn trơ trụi 🌱<br>Thêm lá đầu tiên phía trên nhé!</div>';
    return;
  }
  container.innerHTML = [...list].reverse().map(item=>`
    <div class="leaf-item"><span class="ldate">${new Date(item.date).toLocaleDateString('vi-VN')}</span>${item.text}</div>
  `).join('');
}
function buildTreeSVG(n){
  const svg = document.getElementById('tree-svg');
  const cx=150, canopyCy=140, canopyR=95;
  let html = `<rect x="140" y="190" width="20" height="90" rx="6" fill="#8B6F52"/>`;
  html += `<ellipse cx="150" cy="150" rx="105" ry="95" fill="#E9F2E8" opacity="0.55"/>`;
  const count = Math.min(n, 250);
  const colors = ['#8FAE8B','#5F8360','#A9C7A3'];
  for(let i=0;i<count;i++){
    const angle = i*137.5*Math.PI/180;
    const radiusFrac = Math.sqrt(i/(count||1));
    const rx = radiusFrac*canopyR;
    const x = cx + rx*Math.cos(angle);
    const y = canopyCy + rx*Math.sin(angle)*0.82;
    const color = colors[i%colors.length];
    html += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="${color}" opacity="0.9"/>`;
  }
  svg.innerHTML = html;
}

/* ---------- LỜI HỨA NHỎ ---------- */
function getPromises(){
  const code = getSyncCode();
  const key = code ? `trinhiu_promises_${code}` : 'trinhiu_promises';
  try{ return JSON.parse(localStorage.getItem(key) || '[]'); }
  catch(e){ return []; }
}
function savePromises(list){
  const code = getSyncCode();
  const key = code ? `trinhiu_promises_${code}` : 'trinhiu_promises';
  localStorage.setItem(key, JSON.stringify(list));
}
function addPromise(){
  const who = document.getElementById('promise-who').value;
  const ta = document.getElementById('promise-input');
  const text = ta.value.trim();
  if(!text) return;
  const list = getPromises();
  list.push({ who: who, text: text, date: new Date().toISOString(), kept:false });
  savePromises(list);
  ta.value = '';
  renderPromises();
}
function togglePromise(idx){
  const list = getPromises();
  list[idx].kept = !list[idx].kept;
  savePromises(list);
  renderPromises();
}
function renderPromises(){
  const list = getPromises();
  const container = document.getElementById('promise-list');
  if(list.length===0){
    container.innerHTML = '<div class="empty-msg">Chưa có lời hứa nào 🤝<br>Viết lời hứa đầu tiên phía trên nhé!</div>';
    return;
  }
  container.innerHTML = list.map((item,i)=>`
    <div class="promise-item ${item.kept?'kept':''}">
      <input type="checkbox" ${item.kept?'checked':''} onchange="togglePromise(${i})">
      <div>
        <span class="pmeta">${item.who} • ${new Date(item.date).toLocaleDateString('vi-VN')}</span>
        <span class="ptext">${item.text}</span>
      </div>
    </div>
  `).join('');
}

/* ---------- INIT ON LOAD ---------- */
document.addEventListener('DOMContentLoaded', function(){
  showSyncCodeModal();
});
</script>
