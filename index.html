<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trịnh iu chọn đi 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF7E8;
    --cream-deep:#FBEFD2;
    --pink-soft:#F7C6D9;
    --pink:#EE7FA6;
    --pink-deep:#D94C7B;
    --sage:#8FAE8B;
    --sage-deep:#5F8360;
    --brown:#5B4636;
    --sky:#CFE3EF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Nunito', sans-serif;
    color:var(--brown);
    background:
      radial-gradient(circle at 15% 8%, #E4EEF6 0%, transparent 45%),
      linear-gradient(180deg, var(--sky) 0%, var(--cream) 35%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }
  .phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    position:relative;
    padding:28px 20px 60px;
  }
 
  .eyebrow{
    text-align:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:2px;
    color:var(--sage-deep);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  h1.title{
    font-family:'Baloo 2', sans-serif;
    text-align:center;
    color:var(--pink-deep);
    font-size:34px;
    font-weight:800;
    line-height:1.15;
    margin:0 0 24px;
    text-shadow: 2px 2px 0px rgba(238,127,166,0.18);
  }
  .card{
    background:var(--cream-deep);
    border-radius:32px 32px 20px 20px;
    box-shadow: 0 12px 30px -10px rgba(217,76,123,0.25);
    padding:30px 22px 26px;
    position:relative;
  }
  .menu-btn{
    display:block;
    width:100%;
    padding:16px 18px;
    margin-bottom:14px;
    border-radius:999px;
    border:2px solid var(--pink);
    background:#fff;
    color:var(--pink-deep);
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.4px;
    cursor:pointer;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    text-align:center;
  }
  .menu-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 14px -6px rgba(238,127,166,0.5);
    background:var(--pink-soft);
  }
  .menu-btn:active{ transform:translateY(0px) scale(0.98); }
  .menu-btn .sub{
    display:block;
    font-family:'Nunito', sans-serif;
    font-weight:600;
    font-size:11.5px;
    color:var(--sage-deep);
    margin-top:2px;
    letter-spacing:0.2px;
  }
 
  .screen{ display:none; animation: fadeIn .35s ease; }
  .screen.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
 
  .back-btn{
    background:none;
    border:none;
    color:var(--sage-deep);
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    padding:0 0 14px;
    display:flex;
    align-items:center;
    gap:4px;
  }
 
  /* Lời khuyên hôm nay */
  .advice-box{
    background:#fff;
    border-radius:20px;
    padding:26px 20px;
    text-align:center;
    border:2px dashed var(--pink);
    min-height:140px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .advice-text{
    font-family:'Baloo 2', sans-serif;
    font-size:17px;
    font-weight:600;
    color:var(--brown);
    line-height:1.5;
  }
  .date-tag{
    text-align:center;
    font-size:12px;
    color:var(--sage-deep);
    font-weight:700;
    margin:10px 0 16px;
  }
  .action-btn{
    display:block;
    width:100%;
    padding:14px;
    border-radius:999px;
    border:none;
    background:var(--pink-deep);
    color:#fff;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    margin-top:14px;
  }
  .action-btn:active{ transform:scale(0.98); }
  .action-btn.secondary{
    background:transparent;
    color:var(--pink-deep);
    border:2px solid var(--pink-deep);
  }
  
   /* Anniversary Modal */
  .anniversary-overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    animation: fadeIn .4s ease;
  }
  .anniversary-modal{
    background:linear-gradient(135deg, #FFE5F0 0%, #FFF7E8 100%);
    border-radius:28px;
    padding:40px 30px;
    max-width:340px;
    text-align:center;
    box-shadow:0 20px 60px rgba(217,76,123,0.3);
    position:relative;
    border:3px solid #EE7FA6;
    animation: popIn .5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .anniversary-close{
    position:absolute;
    top:12px;
    right:12px;
    background:none;
    border:none;
    font-size:24px;
    color:#D94C7B;
    cursor:pointer;
    width:32px;
    height:32px;
  }
  .anniversary-content{
    animation: float 3s ease-in-out infinite;
  }
  .anniversary-emoji{
    font-size:60px;
    margin-bottom:12px;
    animation: heartbeat 1.5s ease-in-out infinite;
  }
  .anniversary-modal h2{
    font-family:'Baloo 2', sans-serif;
    font-size:28px;
    font-weight:800;
    color:#D94C7B;
    margin:0 0 8px;
  }
  .anniversary-modal p{
    font-family:'Baloo 2', sans-serif;
    font-size:15px;
    font-weight:700;
    color:#5F8360;
    margin:0 0 12px;
  }
  .anniversary-time{
    font-family:'Baloo 2', sans-serif;
    font-size:24px;
    font-weight:800;
    color:#EE7FA6;
    margin:16px 0;
  }
 
  /* Milestone Modal (2, 3, 4... năm) */
  .milestone-overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(217,76,123,0.8);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    animation: milestoneBackgroundPulse 2s ease-in-out infinite;
  }
  @keyframes milestoneBackgroundPulse{
    0%, 100%{ background:rgba(217,76,123,0.8); }
    50%{ background:rgba(238,127,166,0.9); }
  }
  .milestone-modal{
    background:linear-gradient(135deg, #FFE5F0 0%, #FFF0F5 50%, #FFE5F0 100%);
    border-radius:32px;
    padding:50px 35px;
    max-width:360px;
    text-align:center;
    box-shadow:
      0 0 60px rgba(217,76,123,0.6),
      0 0 40px rgba(238,127,166,0.4),
      inset 0 0 40px rgba(255,255,255,0.5);
    position:relative;
    border:4px solid #D94C7B;
    animation: milestonePopIn .6s cubic-bezier(0.26, 1.8, 0.64, 1);
  }
  @keyframes milestonePopIn{
    0%{ transform:scale(0.3) rotate(-10deg); opacity:0; }
    100%{ transform:scale(1) rotate(0deg); opacity:1; }
  }
  .milestone-emoji{
    font-size:50px;
    margin-bottom:16px;
    animation: milestoneEmoji 0.8s ease-in-out;
  }
  @keyframes milestoneEmoji{
    0%{ transform:scale(0) rotate(0deg); }
    50%{ transform:scale(1.2) rotate(10deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }
  .milestone-title{
    font-family:'Baloo 2', sans-serif;
    font-size:32px;
    font-weight:800;
    color:#D94C7B;
    margin:0 0 8px;
    text-shadow:2px 2px 0 rgba(255,255,255,0.5);
    animation: titleShine 2s ease-in-out infinite;
  }
  @keyframes titleShine{
    0%, 100%{ color:#D94C7B; }
    50%{ color:#E94C8B; text-shadow:2px 2px 0 rgba(255,200,200,0.8); }
  }
  .milestone-subtitle{
    font-family:'Baloo 2', sans-serif;
    font-size:16px;
    font-weight:700;
    color:#5F8360;
    margin:0 0 16px;
  }
  .milestone-time{
    font-family:'Baloo 2', sans-serif;
    font-size:36px;
    font-weight:800;
    background:linear-gradient(135deg, #D94C7B, #EE7FA6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    margin:20px 0;
    animation: scaleUp 0.8s cubic-bezier(0.26, 1.8, 0.64, 1);
  }
  @keyframes scaleUp{
    0%{ transform:scale(0.5); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }
  .milestone-sparkles{
    display:flex;
    justify-content:space-around;
    margin-top:20px;
  }
  .sparkle{
    font-size:28px;
    animation: sparkleFloat 2s ease-in-out infinite;
  }
  .sparkle:nth-child(1){ animation-delay:0s; }
  .sparkle:nth-child(2){ animation-delay:0.3s; }
  .sparkle:nth-child(3){ animation-delay:0.6s; }
  .sparkle:nth-child(4){ animation-delay:0.9s; }
  .sparkle:nth-child(5){ animation-delay:1.2s; }
  @keyframes sparkleFloat{
    0%, 100%{ transform:translateY(0px) scale(1); opacity:1; }
    50%{ transform:translateY(-15px) scale(1.2); opacity:0.8; }
  }
 
  /* Confetti */
  .confetti{
    position:absolute;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden;
  }
  .confetti-piece{
    position:absolute;
    width:10px;
    height:10px;
    animation: confettiFall 3s linear infinite;
  }
  @keyframes confettiFall{
    to{ transform:translateY(500px) rotate(720deg); opacity:0; }
  }
 
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes popIn{ 0%{ transform:scale(0.5); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  @keyframes float{ 0%, 100%{ transform:translateY(0px); } 50%{ transform:translateY(-8px); } }
  @keyframes heartbeat{ 0%, 100%{ transform:scale(1); } 50%{ transform:scale(1.1); } }
 
    text-align:center;
    color:var(--sage-deep);
    font-weight:700;
    font-family:'Baloo 2', sans-serif;
    padding:30px 10px;
  }
 
  /* Card draw */
  .card-table{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    margin:10px 0 8px;
  }
  .mini-card{
    aspect-ratio:2/3;
    background:linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:#fff;
    font-size:22px;
    box-shadow:0 6px 12px -6px rgba(217,76,123,0.5);
    transition: transform .2s ease;
    user-select:none;
  }
  .mini-card:hover{ transform:translateY(-4px) rotate(-2deg); }
  .mini-card.picked{ opacity:0.25; pointer-events:none; }
  .result-card{
    background:#fff;
    border-radius:20px;
    padding:24px 20px;
    text-align:center;
    border:2px solid var(--pink);
    margin-top:14px;
  }
  .result-card .icon{ font-size:34px; margin-bottom:8px; display:block;}
  .result-card .txt{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:16px;
  }
 
  /* Wheel */
  .wheel-tabs{
    display:flex;
    gap:6px;
    margin-bottom:14px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .wheel-tab{
    padding:7px 14px;
    border-radius:999px;
    border:2px solid var(--pink);
    background:#fff;
    color:var(--pink-deep);
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:12px;
    cursor:pointer;
  }
  .wheel-tab.active{
    background:var(--pink-deep);
    color:#fff;
    border-color:var(--pink-deep);
  }
  .wheel-wrap{
    display:flex;
    justify-content:center;
    margin:6px 0 18px;
    position:relative;
  }
  .pointer{
    position:absolute;
    top:-6px;
    left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:10px solid transparent;
    border-right:10px solid transparent;
    border-top:18px solid var(--pink-deep);
    z-index:5;
  }
  #wheel{
    width:260px;
    height:260px;
    border-radius:50%;
    transition: transform 4s cubic-bezier(.17,.67,.21,1);
    box-shadow:0 10px 24px -8px rgba(217,76,123,0.4);
    border:6px solid #fff;
  }
  .wheel-result{
    background:#fff;
    border-radius:18px;
    padding:18px;
    text-align:center;
    border:2px solid var(--sage);
    display:none;
  }
  .wheel-result.show{ display:block; }
  .wheel-result .txt{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:16px;
    color:var(--sage-deep);
  }
 
  /* Love counter */
  .counter-setup{
    background:#fff;
    border-radius:20px;
    padding:22px 20px;
    text-align:center;
    border:2px dashed var(--pink);
  }
  .counter-setup input[type="date"]{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:2px solid var(--pink-soft);
    font-family:'Nunito', sans-serif;
    font-size:14px;
    font-weight:700;
    color:var(--brown);
    margin-top:10px;
    margin-bottom:6px;
  }
  .counter-setup label{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--pink-deep);
  }
  .counter-display{
    text-align:center;
    padding:10px 0 6px;
  }
  .counter-number{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:52px;
    color:var(--pink-deep);
    line-height:1;
  }
  .counter-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--sage-deep);
    margin-top:4px;
  }
  .counter-since{
    text-align:center;
    font-size:12px;
    color:var(--brown);
    opacity:0.7;
    margin-top:4px;
  }
  .milestone-box{
    background:#fff;
    border-radius:16px;
    padding:16px;
    margin-top:18px;
    border-left:5px solid var(--pink);
  }
  .milestone-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--pink-deep);
    margin-bottom:8px;
  }
  .milestone-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    font-weight:600;
    padding:5px 0;
    border-bottom:1px dashed #f0d9e3;
  }
  .milestone-row:last-child{ border-bottom:none; }
  .milestone-row.done{ color:var(--sage-deep); }
  .milestone-row.next{ color:var(--pink-deep); font-weight:800; }
 
  /* Love language quiz */
  .ll-option{
    display:block;
    width:100%;
    text-align:left;
    padding:13px 16px;
    margin-bottom:10px;
    border-radius:14px;
    border:2px solid var(--pink-soft);
    background:#fff;
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size:13.5px;
    color:var(--brown);
    cursor:pointer;
  }
  .ll-option:hover{ background:var(--pink-soft); }
  .ll-result-box{
    background:#fff;
    border-radius:20px;
    padding:26px 20px;
    text-align:center;
    border:2px solid var(--pink);
  }
  .ll-result-icon{ font-size:40px; display:block; margin-bottom:8px; }
  .ll-result-name{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:19px;
    color:var(--pink-deep);
    margin-bottom:8px;
  }
  .ll-result-desc{
    font-size:14px;
    font-weight:600;
    line-height:1.5;
  }
  .ll-bars{ margin-top:18px; }
  .ll-bar-row{ margin-bottom:10px; }
  .ll-bar-label{
    font-size:12px;
    font-weight:700;
    color:var(--sage-deep);
    margin-bottom:3px;
    display:flex;
    justify-content:space-between;
  }
  .ll-bar-track{
    background:#f2e2ea;
    border-radius:999px;
    height:10px;
    overflow:hidden;
  }
  .ll-bar-fill{
    height:100%;
    background:var(--pink-deep);
    border-radius:999px;
    transition: width .6s ease;
  }
 
  /* Shared form elements for new features */
  .write-box{
    background:#fff;
    border-radius:18px;
    padding:18px;
    border:2px dashed var(--pink);
    margin-bottom:16px;
  }
  .form-group{ margin-bottom:12px; text-align:left; }
  .form-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--pink-deep);
    display:block;
    margin-bottom:6px;
  }
  .form-input, .form-textarea, .form-select{
    width:100%;
    padding:11px 12px;
    border-radius:12px;
    border:2px solid var(--pink-soft);
    font-family:'Nunito', sans-serif;
    font-size:13.5px;
    font-weight:600;
    color:var(--brown);
    background:#fff;
  }
  .form-textarea{ min-height:70px; resize:vertical; }
 
  /* Cây biết ơn */
  .tree-wrap{ display:flex; justify-content:center; margin:6px 0 16px; }
  .tree-count{
    text-align:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    color:var(--sage-deep);
    margin-bottom:6px;
    font-size:14px;
  }
  .leaf-item{
    background:#fff;
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:8px;
    border-left:5px solid var(--sage);
    font-size:13.5px;
    font-weight:600;
  }
  .leaf-item .ldate{
    display:block;
    font-size:11px;
    color:var(--sage-deep);
    font-weight:700;
    margin-bottom:3px;
  }
 
  /* Lời hứa nhỏ */
  .promise-item{
    background:#fff;
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:10px;
    border-left:5px solid var(--pink);
    display:flex;
    align-items:flex-start;
    gap:10px;
  }
  .promise-item input[type="checkbox"]{
    margin-top:3px;
    width:18px;
    height:18px;
    accent-color: var(--pink-deep);
    flex-shrink:0;
  }
  .promise-item .ptext{ font-size:14px; font-weight:600; }
  .promise-item.kept .ptext{ text-decoration:line-through; opacity:0.55; }
  .promise-item .pmeta{
    display:block;
    font-size:11px;
    color:var(--sage-deep);
    font-weight:700;
    margin-bottom:3px;
  }
 
</style>
</head>
<body>
<div class="phone">
 <!-- ANNIVERSARY REGULAR MODAL -->
  <div id="anniversary-overlay" class="anniversary-overlay" style="display:none;">
    <div class="anniversary-modal">
      <button class="anniversary-close" onclick="closeAnniversary()">✕</button>
      <div class="anniversary-content">
        <div class="anniversary-emoji">💕</div>
        <h2>Hẹ hẹ!</h2>
        <p>Chúc mừng bạn trai đã có được toi</p>
        <div class="anniversary-time" id="anniversary-time">1 năm 8 tháng</div>
      </div>
    </div>
 
  <!-- ANNIVERSARY MILESTONE MODAL (2, 3, 4... năm) -->
  <div id="milestone-overlay" class="milestone-overlay" style="display:none;">
    <div class="milestone-modal">
      <button class="anniversary-close" onclick="closeAnniversary()">✕</button>
      <div class="confetti" id="confetti"></div>
      <div class="milestone-content">
        <div class="milestone-emoji">🎉✨💕✨🎉</div>
        <h2 class="milestone-title">ĐẠT CÓT MỐC!</h2>
        <p class="milestone-subtitle">Chúc mừng bạn trai đã có được toi</p>
        <div class="milestone-time" id="milestone-time">2 năm</div>
        <div class="milestone-sparkles">
          <span class="sparkle">✨</span>
          <span class="sparkle">💖</span>
          <span class="sparkle">✨</span>
          <span class="sparkle">🎊</span>
          <span class="sparkle">✨</span>
        </div>
      </div>
    </div>
    
  <div class="eyebrow">Welcome To Em Trâm's Shop</div>
  <h1 class="title">TRỊNH IU<br>CHỌN ĐI 💗</h1>
 
  <!-- MAIN MENU -->
  <div id="screen-menu" class="screen active">
    <div class="card">
      <button class="menu-btn" onclick="showScreen('advice')">
        LỜI KHUYÊN HÔM NAY
        <span class="sub">nhận thông điệp vũ trụ nhá</span>
      </button>
      <button class="menu-btn" onclick="showScreen('draw')">
        RÚT BÀI MAY MẮN
        <span class="sub">rút 1 lá bài ngẫu nhiên</span>
      </button>
      <button class="menu-btn" onclick="showScreen('wheel')">
        VÒNG QUAY HẸN HÒ
        <span class="sub">tụi mình ăn gì / đi đâu / làm gì</span>
      </button>

/* ---------- NAVIGATION ---------- */
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  if(name==='advice') loadTodayAdvice();
  if(name==='draw') resetDraw();
  if(name==='wheel') initWheelScreen();
  if(name==='counter') initCounterScreen();
  if(name==='tree') renderTree();
  if(name==='promise') renderPromises();
}
 
/* ---------- ADVICE ---------- */
function dayIndexSeed(){
  const d = new Date();
  const start = new Date(d.getFullYear(),0,0);
  const diff = d - start;
  return Math.floor(diff / 86400000);
}
function loadTodayAdvice(customIndex){
  const idx = (typeof customIndex === 'number') ? customIndex : (dayIndexSeed() % ADVICE_LIST.length);
  const text = ADVICE_LIST[idx];
  document.getElementById('advice-text').textContent = text;
  document.getElementById('advice-date').textContent = new Date().toLocaleDateString('vi-VN', {weekday:'long', day:'2-digit', month:'2-digit'});
}
function newAdvice(){
  const idx = Math.floor(Math.random()*ADVICE_LIST.length);
  loadTodayAdvice(idx);
}
 
/* ---------- CARD DRAW ---------- */
let drawOrder = [];
 
function canDrawCard(){
  const today = new Date().toISOString().slice(0,10);
  const lastDraw = localStorage.getItem('trinhiu_lastDrawDate');
  return lastDraw !== today;
}
 
function getDrawStatus(){
  const today = new Date().toISOString().slice(0,10);
  const lastDraw = localStorage.getItem('trinhiu_lastDrawDate');
  if(lastDraw === today){
    return '✅ Vui thoy đừng vui quá! Ngày mai khách iu quay lại nghen 💚';
  }
  return '🎴 Anh này, anh được rút 1 lá bài hôm nay';
}
 
function resetDraw(){
  const canDraw = canDrawCard();
  document.getElementById('draw-status').textContent = getDrawStatus();
  document.getElementById('reshuffle-btn').style.display = canDraw ? 'block' : 'none';
  
  if(!canDraw){
    document.getElementById('card-table').innerHTML = '';
    document.getElementById('draw-result').innerHTML = '';
    return;
  }
  
  // Mỗi lần vào (hoặc refresh), shuffle lại 6 lá bài ngẫu nhiên từ danh sách
  drawOrder = [...Array(DRAW_CARDS.length).keys()].sort(()=>Math.random()-0.5).slice(0,6);
  const table = document.getElementById('card-table');
  table.innerHTML = drawOrder.map((cardIdx,i)=>`<div class="mini-card" data-idx="${cardIdx}" onclick="pickCard(this)">🎴</div>`).join('');
  document.getElementById('draw-result').innerHTML = '';
}
 
function pickCard(el){
  if(!canDrawCard()){
    alert(getDrawStatus());
    return;
  }
  document.querySelectorAll('.mini-card').forEach(c=>c.classList.add('picked'));
  const idx = el.getAttribute('data-idx');
  const card = DRAW_CARDS[idx];
  
  // Lưu ngày đã rút

/* ---------- WHEEL (8 ô cố định) ---------- */
let currentRotation = 0;
const WHEEL_COLORS_8 = ["#EE7FA6","#F7C6D9","#8FAE8B","#CFE3EF","#D94C7B","#A9C7A3","#5F8360","#F7C6D9"];
 
function initWheelScreen(){
  const tabsWrap = document.getElementById('wheel-tabs');
  tabsWrap.innerHTML = Object.keys(WHEEL_GROUPS).map(g =>
    `<button class="wheel-tab ${g===currentWheelGroup?'active':''}" onclick="switchWheelGroup('${g}')">${g}</button>`
  ).join('');
  document.getElementById('wheel-result').classList.remove('show');
  buildWheel8();
}
 
function buildWheel8(){
  const svg = document.getElementById('wheel');
  const cx=100, cy=100, r=100;
  let paths = '';
  
  // 8 ô, không có chữ bên trong
  for(let i=0;i<8;i++){
    const startAngle = (i/8)*2*Math.PI - Math.PI/2;
    const endAngle = ((i+1)/8)*2*Math.PI - Math.PI/2;
    const x1 = cx + r*Math.cos(startAngle);
    const y1 = cy + r*Math.sin(startAngle);
    const x2 = cx + r*Math.cos(endAngle);
    const y2 = cy + r*Math.sin(endAngle);
    paths += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 0,1 ${x2},${y2} Z" fill="${WHEEL_COLORS_8[i]}" stroke="#fff" stroke-width="2"/>`;
  }
  svg.innerHTML = paths;
}
 
function switchWheelGroup(g){
  currentWheelGroup = g;
  currentRotation = 0;
  const svg = document.getElementById('wheel');
  svg.style.transition = 'none';
  svg.style.transform = 'rotate(0deg)';
  
  // Highlight tab được chọn
  document.querySelectorAll('.wheel-tab').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  
  requestAnimationFrame(()=>{ svg.style.transition = 'transform 4s cubic-bezier(.17,.67,.21,1)'; });
  buildWheel8();
}
 
function buildWheel8(){
  const svg = document.getElementById('wheel');
  const cx=100, cy=100, r=100;
  let paths = '';
  
  // Xác định ô highlight dựa trên tab được chọn
  // "Ăn gì" = 0, "Đi đâu" = 1, "Làm gì" = 2 (chia 8 ô cho 3 nhóm)
  const groupOrder = Object.keys(WHEEL_GROUPS);
  const groupIndex = groupOrder.indexOf(currentWheelGroup);
  // Mỗi nhóm lấy 8/3 ≈ 2-3 ô, ở đây ta highlight ô top (ô 0) khi là "Ăn gì"
  // Hoặc highlight ô theo thứ tự nhóm
  const highlightSegment = groupIndex; // ô được highlight
  
  // 8 ô, không có chữ bên trong
  for(let i=0;i<8;i++){
    const startAngle = (i/8)*2*Math.PI - Math.PI/2;
    const endAngle = ((i+1)/8)*2*Math.PI - Math.PI/2;
    const x1 = cx + r*Math.cos(startAngle);
    const y1 = cy + r*Math.sin(startAngle);
    const x2 = cx + r*Math.cos(endAngle);
    const y2 = cy + r*Math.sin(endAngle);
    
    // Nếu là ô được highlight, dùng màu hồng đậm
    const fillColor = i === highlightSegment ? '#D94C7B' : WHEEL_COLORS_8[i];
    
    paths += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 0,1 ${x2},${y2} Z" fill="${fillColor}" stroke="#fff" stroke-width="2"/>`;
  }
  svg.innerHTML = paths;
}
 
function spinWheel(){
  const options = WHEEL_GROUPS[currentWheelGroup];
  const chosen = Math.floor(Math.random()*options.length);
  
  // 8 ô, kim chỉ ở top (angle 0)
  // Mỗi ô = 45°, kim cần dừng ở giữa ô = 22.5° offset
  const degPerSegment = 360/8;
  const segmentAngle = chosen * degPerSegment + degPerSegment / 2; // Giữa ô
  
  // Random xoay nhiều vòng rồi dừng ở giữa ô
  const spins = 5 + Math.floor(Math.random()*4); // 5-8 vòng
  const totalDegrees = spins * 360 + segmentAngle;
  
  const svg = document.getElementById('wheel');
  svg.style.transform = `rotate(${totalDegrees}deg)`;
  document.getElementById('wheel-result').classList.remove('show');
  
  setTimeout(()=>{
    document.getElementById('wheel-result-text').textContent = "💚 " + options[chosen];
    document.getElementById('wheel-result').classList.add('show');
    // Reset rotation để lần quay tiếp theo quay từ đầu
    currentRotation = totalDegrees;
  }, 4100);
}
 
/* ---------- LOVE COUNTER ---------- */
const MILESTONES = [
  { days: 30, label: "Tròn 1 tháng" },
  { days: 100, label: "Tròn 100 ngày" },
  { days: 200, label: "Tròn 200 ngày" },
  { days: 365, label: "Tròn 1 năm" },
  { days: 500, label: "Tròn 500 ngày" },
  { days: 730, label: "Tròn 2 năm" },
  { days: 1000, label: "Tròn 1000 ngày" },
  { days: 1095, label: "Tròn 3 năm" }
];
function getLoveDate(){
  return localStorage.getItem('trinhiu_lovedate');
}
function saveLoveDate(){
  const input = document.getElementById('counter-date-input').value;
  if(!input){ return; }
  localStorage.setItem('trinhiu_lovedate', input);
  renderCounter();
}
function editLoveDate(){
  document.getElementById('counter-setup-box').style.display = 'block';
  document.getElementById('counter-result-box').style.display = 'none';
  const existing = getLoveDate();
  if(existing) document.getElementById('counter-date-input').value = existing;
}
function initCounterScreen(){
  const existing = getLoveDate();
  if(existing){
    renderCounter();
  } else {
    document.getElementById('counter-setup-box').style.display = 'block';
    document.getElementById('counter-result-box').style.display = 'none';
  }
}
function renderCounter(){
  const dateStr = getLoveDate();
  if(!dateStr) return;
  const start = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  const diffDays = Math.floor((now - start) / 86400000);
 
  document.getElementById('counter-setup-box').style.display = 'none';
  document.getElementById('counter-result-box').style.display = 'block';
  document.getElementById('counter-days').textContent = diffDays >= 0 ? diffDays : 0;
  document.getElementById('counter-since').textContent = "kể từ ngày " + start.toLocaleDateString('vi-VN');
 
  const list = document.getElementById('milestone-list');
  let nextShown = false;
  list.innerHTML = MILESTONES.map(m => {
    const done = diffDays >= m.days;
    const isNext = !done && !nextShown;
    if(isNext) nextShown = true;
    const cls = done ? 'done' : (isNext ? 'next' : '');
    const rightText = done ? '✔ đã qua' : (isNext ? `còn ${m.days - diffDays} ngày` : `ngày thứ ${m.days}`);
    return `<div class="milestone-row ${cls}"><span>${m.label}</span><span>${rightText}</span></div>`;
  }).join('');
}
 
/* ---------- LOVE LANGUAGE QUIZ ---------- */
let llIndex = 0;
let llScores = {};
function startLoveLang(){
  llIndex = 0;
  llScores = { words:0, acts:0, gifts:0, time:0, touch:0 };
  document.getElementById('ll-quiz-box').style.display = 'block';
  document.getElementById('ll-result-box').style.display = 'none';

}
function renderLLQuestion(){
  const q = LL_QUESTIONS[llIndex];

  document.getElementById('ll-question').textContent = q.q;

  ).join('');

function answerLL(lang){
  llScores[lang] = (llScores[lang]||0) + 1;
  llIndex++;
  if(llIndex < LL_QUESTIONS.length){
    renderLLQuestion();
  } else {
    showLLResult();
  }

function showLLResult(){
  document.getElementById('ll-quiz-box').style.display = 'none';

  for(const k in llScores){

  }

  document.getElementById('ll-result-icon').textContent = info.icon;

function getLeaves(){
  try{ return JSON.parse(localStorage.getItem('trinhiu_leaves') || '[]'); }
  catch(e){ return []; }
}
function saveLeaves(list){
  localStorage.setItem('trinhiu_leaves', JSON.stringify(list));
}
function addLeaf(){
  const ta = document.getElementById('leaf-input');
  const text = ta.value.trim();
  if(!text) return;
  const list = getLeaves();
  list.push({ date: new Date().toISOString().slice(0,10), text: text });
  saveLeaves(list);
  ta.value = '';
  renderTree();
}
function renderTree(){
  const list = getLeaves();
  document.getElementById('tree-count').textContent = `🍃 ${list.length} lá biết ơn đã được thêm gòy`;
  buildTreeSVG(list.length);
  const container = document.getElementById('leaf-list');
  if(list.length===0){
    container.innerHTML = '<div class="empty-msg">Cây còn trơ trụi 🌱<br>Trịnh iu mở hàng thêm lá đầu tiên nào!</div>';
    return;
  }
  container.innerHTML = [...list].reverse().map(item=>`
    <div class="leaf-item"><span class="ldate">${new Date(item.date).toLocaleDateString('vi-VN')}</span>${item.text}</div>
  `).join('');
}
function buildTreeSVG(n){
  const svg = document.getElementById('tree-svg');
  const cx=150, canopyCy=140, canopyR=95;
  let html = `<rect x="140" y="190" width="20" height="90" rx="6" fill="#8B6F52"/>`;
  html += `<ellipse cx="150" cy="150" rx="105" ry="95" fill="#E9F2E8" opacity="0.55"/>`;
  const count = Math.min(n, 250);
  const colors = ['#8FAE8B','#5F8360','#A9C7A3'];
  for(let i=0;i<count;i++){
    const angle = i*137.5*Math.PI/180;
    const radiusFrac = Math.sqrt(i/(count||1));
    const rx = radiusFrac*canopyR;
    const x = cx + rx*Math.cos(angle);
    const y = canopyCy + rx*Math.sin(angle)*0.82;
    const color = colors[i%colors.length];
    html += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="${color}" opacity="0.9"/>`;
  }
  svg.innerHTML = html;
}

function getPromises(){
  try{ return JSON.parse(localStorage.getItem('trinhiu_promises') || '[]'); }

}
function savePromises(list){
  localStorage.setItem('trinhiu_promises', JSON.stringify(list));

function togglePromise(idx){

}
function renderPromises(){
  const list = getPromises();
  const container = document.getElementById('promise-list');

    container.innerHTML = '<div class="empty-msg">Sách vở trống trơn 🤝<br>Làm liền con beat số 1 nha bae!</div>';
    return;
  }
  container.innerHTML = list.map((item,i)=>`
    <div class="promise-item ${item.kept?'kept':''}">
      <input type="checkbox" ${item.kept?'checked':''} onchange="togglePromise(${i})">
      <div>
        <span class="pmeta">${item.who} • ${new Date(item.date).toLocaleDateString('vi-VN')}</span>
        <span class="ptext">${item.text}</span>

    </div>
  `).join('');
}

const ANNIVERSARY_DATE = new Date(2024, 10, 2); // 2/11/2024 (month 0-indexed)
 
function calculateAnniversary(){
  const today = new Date();
  let years = today.getFullYear() - ANNIVERSARY_DATE.getFullYear();
  let months = today.getMonth() - ANNIVERSARY_DATE.getMonth();
  
  if(today.getDate() < ANNIVERSARY_DATE.getDate()){
    months--;
  }
  
  if(months < 0){
    years--;
    months += 12;
  }
  
  return { years, months };
}
 
function isAnniversaryDay(){
  const today = new Date();
  return today.getDate() === 2;
}
 
function isMilestoneYear(){
  const { years, months } = calculateAnniversary();
  // Tròn năm (0 tháng) = milestone
  return months === 0;
}
 
function createConfetti(){
  const confettiContainer = document.getElementById('confetti');
  confettiContainer.innerHTML = '';
  
  const colors = ['#D94C7B', '#EE7FA6', '#F7C6D9', '#8FAE8B', '#FFE5F0'];
  for(let i = 0; i < 30; i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 0.5 + 's';
    piece.style.animationDuration = (2 + Math.random() * 1) + 's';
    confettiContainer.appendChild(piece);
  }
}
 
function showAnniversaryModal(){
  if(!isAnniversaryDay()) return;
  
  const { years, months } = calculateAnniversary();
  
  if(isMilestoneYear()){
    // Show milestone modal
    const timeStr = years === 1 ? '1 năm' : years + ' năm';
    document.getElementById('milestone-time').textContent = timeStr;
    document.getElementById('milestone-overlay').style.display = 'flex';
    createConfetti();
  } else {
    // Show regular modal
    const timeStr = `${years} năm ${months} tháng`;
    document.getElementById('anniversary-time').textContent = timeStr;
    document.getElementById('anniversary-overlay').style.display = 'flex';
  }
}
 
function closeAnniversary(){
  document.getElementById('anniversary-overlay').style.display = 'none';
  document.getElementById('milestone-overlay').style.display = 'none';
  localStorage.setItem('anniversary_shown_date', new Date().toISOString().slice(0,10));
}
 
// Show modal khi load app
document.addEventListener('DOMContentLoaded', function(){
  const today = new Date().toISOString().slice(0,10);
  const lastShown = localStorage.getItem('anniversary_shown_date');
  
  if(isAnniversaryDay() && lastShown !== today){
    setTimeout(() => showAnniversaryModal(), 800);
  }
});
